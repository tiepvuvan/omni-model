name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — action-setup@v4 reads `packageManager`
      # from package.json, and specifying both is a hard error:
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build (typecheck)
        run: pnpm build
      - name: Test
        run: pnpm test

  # The integration suites gate themselves on TEST_POSTGRES_URL, so without a
  # real server they skip — and a skipped suite reads like a passing one. This
  # job exists so that never happens silently.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: omni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni -d omni_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_POSTGRES_URL: postgres://omni:secret@localhost:5432/omni_test
      # Turns "the gate was closed" into a failure instead of a silent skip.
      OMNI_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The whole suite, not just packages/postgres: the gated suites in
      # packages/admin and packages/node need a real server too, and running one
      # package here is how they went unrun.
      - name: Integration tests (real PostgreSQL)
        run: pnpm exec vitest run
      # The end-to-end suites that need a database rather than an upstream. The
      # OpenRouter ones skip themselves without a key, which is why this step can
      # run unconditionally.
      - name: End-to-end tests (real PostgreSQL, no upstream)
        run: pnpm exec vitest run --config vitest.e2e.config.ts
